name: mobile
description: "MockInterview AI — mobile app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7

  # Networking
  dio: ^5.7.0

  # Storage
  flutter_secure_storage: ^9.2.4

  # Routing
  go_router: ^15.1.2

  # DI
  get_it: ^8.0.3

  # Environment
  flutter_dotenv: ^5.2.1

  # Serialization
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # Audio
  record: ^5.2.0
  audioplayers: ^6.1.0

  # File paths
  path_provider: ^2.1.5
  path: ^1.9.0

  # Utils
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.4.14
  freezed: ^3.0.3
  json_serializable: ^6.9.4

flutter:
  uses-material-design: true

  assets:
    - .env
